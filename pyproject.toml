[tool.uv.workspace]
members = ["backend", "tools/ods"]

[tool.basedpyright]
include = ["backend"]
exclude = ["backend/generated"]
typeCheckingMode = "off"

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
ignore = []
select = [
  "ARG",
  "E",
  "F",
  "W",
]

