{{- if gt (int .Values.indexCapability.replicaCount) 0 }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "onyx.fullname" . }}-indexing-model
  labels:
    {{- include "onyx.labels" . | nindent 4 }}
    {{- with .Values.indexCapability.deploymentLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  replicas: {{ .Values.indexCapability.replicaCount }}
  selector:
    matchLabels:
      {{- include "onyx.selectorLabels" . | nindent 6 }}
      {{- if .Values.indexCapability.deploymentLabels }}
      {{- toYaml .Values.indexCapability.deploymentLabels | nindent 6 }}
      {{- end }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- $pgIntoChecksum := include "onyx.pgInto.checksumAnnotation" . }}
        {{- if $pgIntoChecksum }}
        {{- $pgIntoChecksum | nindent 8 }}
        {{- end }}
      {{- with .Values.indexCapability.podAnnotations }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "onyx.labels" . | nindent 8 }}
        {{- with .Values.indexCapability.deploymentLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- with .Values.indexCapability.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- if .Values.indexCapability.runtimeClassName }}
      runtimeClassName: {{ .Values.indexCapability.runtimeClassName }}
      {{- end }}
      {{- if .Values.indexCapability.podSecurityContext }}
      securityContext:
        {{- toYaml .Values.indexCapability.podSecurityContext | nindent 8 }}
      {{- end }}
      {{- with .Values.indexCapability.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- $modelRepo := .Values.global.image.repository }}
      {{- if and .Values.indexCapability.image .Values.indexCapability.image.repository }}
        {{- $modelRepo = .Values.indexCapability.image.repository }}
      {{- end }}
      {{- $modelTag := default .Values.global.image.tags.modelServer (printf "model_server-%s" .Values.global.version) }}
      {{- if and .Values.indexCapability.image .Values.indexCapability.image.tag }}
        {{- $modelTag = .Values.indexCapability.image.tag }}
      {{- end }}
      {{- with .Values.indexCapability.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.indexCapability.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
      - name: {{ .Values.indexCapability.name }}
        image: "{{ $modelRepo }}:{{ $modelTag }}"
        imagePullPolicy: {{ .Values.global.pullPolicy }}
        command: [ "uvicorn", "model_server.main:app", "--host", {{ .Values.global.host }}, "--port", "{{ .Values.indexCapability.containerPorts.server }}", "--limit-concurrency", "{{ .Values.indexCapability.limitConcurrency }}" ]
        ports:
        - name: model-server
          containerPort: {{ .Values.indexCapability.containerPorts.server }}
          protocol: TCP
        envFrom:
          - configMapRef:
              name: {{ .Values.config.envConfigMapName }}
        env:
          - name: INDEXING_ONLY
            value: "{{ default "True" .Values.indexCapability.indexingOnly }}"
          {{- if .Values.indexCapability.huggingfaceCacheDir }}
          - name: HF_HOME
            value: "{{ .Values.indexCapability.huggingfaceCacheDir }}"
          {{- end }}
          {{- include "onyx.envSecrets" . | nindent 10}}
        {{- if .Values.indexCapability.securityContext }}
        securityContext:
          {{- toYaml .Values.indexCapability.securityContext | nindent 10 }}
        {{- end }}
        {{- if .Values.indexCapability.resources }}
        resources:
          {{- toYaml .Values.indexCapability.resources | nindent 10 }}
        {{- end }}
               {{- with .Values.indexCapability.startupProbe }}
        startupProbe:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- with .Values.indexCapability.readinessProbe }}
        readinessProbe:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- with .Values.indexCapability.livenessProbe }}
        livenessProbe:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- $indexVolumeMounts := include "onyx.renderVolumeMounts" (dict "ctx" . "volumeMounts" .Values.indexCapability.volumeMounts) }}
        {{- if $indexVolumeMounts }}
        {{- $indexVolumeMounts | nindent 8 }}
        {{- end }}
      {{- $indexVolumes := include "onyx.renderVolumes" (dict "ctx" . "volumes" .Values.indexCapability.volumes) }}
      {{- if $indexVolumes }}
      {{- $indexVolumes | nindent 6 }}
      {{- end }}
{{- end }}
