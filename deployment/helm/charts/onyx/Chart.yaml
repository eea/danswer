apiVersion: v2
name: onyx
description: A Helm chart for Kubernetes
home: https://www.onyx.app/
sources:
  - "https://github.com/onyx-dot-app/onyx"
type: application
version: 0.4.7
appVersion: latest
annotations:
  category: Productivity
  licenses: MIT
  images: |
    - name: webserver
      image: eeacms/danswer:web-v2.3.0-eea.0.0.83-dev
    - name: background
      image: eeacms/danswer:backend-v2.3.0-eea.0.0.83-dev
    - name: model-server
      image: eeacms/danswer:model_server-v2.3.0-eea.0.0.83-dev
    - name: vespa
      image: vespaengine/vespa:8.526.15
dependencies:
  - name: vespa
    version: 0.2.24
    repository: https://onyx-dot-app.github.io/vespa-helm-charts
    condition: vespa.enabled

  - name: minio
    version: 5.4.0
    repository: https://charts.min.io/
    condition: minio.enabled
